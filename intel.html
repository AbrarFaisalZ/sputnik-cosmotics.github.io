<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sputnik Cosmotics</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #0d1b2a 0%, #000000 100%);
      color: #f1f1f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      min-height: 100vh;
    }header {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding: 1rem;
  text-align: center;
}

header h1 {
  font-size: 2.5rem;
  margin: 0;
  color: #a0e9ff;
  letter-spacing: 1px;
}

.logo {
  margin: 1rem auto;
  width: 150px;
  height: auto;
}

.main-section {
  padding: 2rem;
  max-width: 800px;
  text-align: center;
}

.main-section h2 {
  color: #ffcc70;
}

iframe {
  margin-top: 1rem;
  border: none;
  border-radius: 12px;
}

.footer {
  margin-top: auto;
  padding: 1rem;
  font-size: 0.9rem;
  color: #888;
}

  </style>
</head>
<body>
  <header>
    <h1>Sputnik Cosmotics</h1>
  </header>
  <img src="sputnik-logo.png" alt="Sputnik Cosmotics Logo" class="logo" />
  <section class="main-section">
    <h2>Planetary Events & Visibility</h2>
    <p>Track visible planets, upcoming cosmic events, and what's lighting up the night sky today!</p>
    <!-- Replace with real AstronomyAPI embed when ready -->
    <iframe 
      src="https://in-the-sky.org/newscal.php?year=2025&month=6&maxdiff=7"
      width="100%"
      height="600px"
      title="Astronomical Events Calendar"
    ></iframe>
  </section>
  <div class="footer">
    &copy; 2025 Sputnik Cosmotics — Reach for the cosmos 🌌
  </div>
</body>
</html>
