<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #282c34, #3a3f55);
      color: #eee;
    }

    /* Navbar */
    nav {
      background: #222831;
      padding: 12px 24px;
      display: flex;
      justify-content: center;
      gap: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    nav a {
      color: #eee;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 6px 12px;
      border-radius: 6px;
      transition: 0.3s;
    }

    nav a:hover {
      background: #00adb5;
      color: #222831;
    }

    nav a.active {
      color: #00adb5;
      background-color: #393e46;
      font-weight: 700;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 24px;
      background: #222831;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      text-align: center;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00adb5;
      margin-bottom: 1.5rem;
      cursor: pointer;
    }

    #usernameDisplay, #usernameInput {
      font-size: 2.2rem;
      font-weight: bold;
      margin: 0.2rem 0;
    }

    #usernameDisplay:hover {
      color: #00adb5;
      cursor: pointer;
    }

    #usernameInput {
      border: none;
      border-bottom: 2px solid #00adb5;
      background: transparent;
      color: #eee;
      outline: none;
      display: none;
    }

    .badge-founder {
      margin-top: 10px;
      background: linear-gradient(45deg, #f39c12, #d35400);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 6px 14px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 0 14px #f39c12;
    }

    .bio {
      margin-top: 12px;
      font-size: 1.1rem;
      color: #ccc;
    }

    .btns {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btns button {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      background-color: #00adb5;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    .btns button:hover {
      background-color: #0099a1;
    }

    #avatarUpload {
      display: none;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav>
  <a href="index.html">Home</a>
  <a href="blogs.html">Blogs</a>
  <a href="profile.html" class="active">Profile</a>
  <a href="about.html">About Us</a>
</nav>

<!-- Main Profile Container -->
<div class="container">
  <!-- Avatar Upload -->
  <img id="avatar" class="avatar" src="" alt="Avatar" title="Click to upload image" />
  <input type="file" id="avatarUpload" accept="image/*" />

  <!-- Username -->
  <div>
    <span id="usernameDisplay">username123</span>
    <input type="text" id="usernameInput" maxlength="20" />
  </div>

  <!-- Founder Badge -->
  <div id="badgeContainer"></div>

  <!-- Bio -->
  <p class="bio">Public profile. Others can view your username and profile picture.</p>

  <!-- Buttons -->
  <div class="btns">
    <button onclick="signIn()">Sign in with Google</button>
    <button onclick="logOut()">Log Out</button>
  </div>
</div>

<!-- Script -->
<script>
  const avatar = document.getElementById('avatar');
  const avatarUpload = document.getElementById('avatarUpload');
  const usernameDisplay = document.getElementById('usernameDisplay');
  const usernameInput = document.getElementById('usernameInput');
  const badgeContainer = document.getElementById('badgeContainer');

  // Dummy data (replace with real logic from your system)
  const isFounder = true;

  function getDefaultAvatar(username) {
    return `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=00adb5&color=fff&size=130`;
  }

  function updateAvatar() {
    const username = usernameDisplay.textContent.trim();
    const uploaded = localStorage.getItem('customPfp');
    avatar.src = uploaded || getDefaultAvatar(username);
  }

  function updateBadge() {
    if (isFounder) {
      badgeContainer.innerHTML = `<div class="badge-founder">👑 Founder</div>`;
    } else {
      badgeContainer.innerHTML = '';
    }
  }

  function saveUsername() {
    const newName = usernameInput.value.trim() || 'username123';
    usernameDisplay.textContent = newName;
    usernameDisplay.style.display = 'inline-block';
    usernameInput.style.display = 'none';
    updateAvatar();
  }

  // Inline username edit
  usernameDisplay.addEventListener('click', () => {
    usernameInput.value = usernameDisplay.textContent;
    usernameDisplay.style.display = 'none';
    usernameInput.style.display = 'inline-block';
    usernameInput.focus();
  });

  usernameInput.addEventListener('blur', saveUsername);
  usernameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') usernameInput.blur();
  });

  // Avatar upload
  avatar.addEventListener('click', () => {
    avatarUpload.click();
  });

  avatarUpload.addEventListener('change', event => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      localStorage.setItem('customPfp', e.target.result);
      updateAvatar();
    };
    reader.readAsDataURL(file);
  });

  // Google Sign-In simulation
  function signIn() {
    alert('Google Sign-In triggered (mock)');
  }

  function logOut() {
    localStorage.removeItem('customPfp');
    alert('Logged out (mock)');
    location.reload();
  }

  // Init
  updateAvatar();
  updateBadge();
</script>

</body>
</html>
