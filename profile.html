<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>User Profile</title>
<style>
  /* Background with subtle gradient */
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    margin: 0;
    padding: 2rem 0;
    color: #fff;
  }

  .profile-container {
    max-width: 600px;
    margin: 0 auto;
    background: rgba(0,0,0,0.6);
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
  }

  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #fff;
    display: block;
    margin: 0 auto 1.5rem;
    transition: transform 0.3s ease;
    cursor: pointer;
  }
  .avatar:hover {
    transform: scale(1.1);
  }

  .username-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 0.75rem;
  }

  /* Username display */
  #usernameDisplay {
    font-size: 2.5rem;
    font-weight: 700;
    cursor: pointer;
    transition: color 0.3s ease;
  }
  #usernameDisplay:hover {
    color: #ffdd57;
  }

  /* Username input (hidden by default) */
  #usernameInput {
    font-size: 2.5rem;
    font-weight: 700;
    border: none;
    border-bottom: 2px solid #ffdd57;
    background: transparent;
    color: #fff;
    outline: none;
    width: 250px;
    display: none;
  }

  /* Stylish badges */
  .badge {
    font-weight: 600;
    font-size: 1rem;
    padding: 4px 12px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    user-select: none;
    box-shadow: 0 0 8px rgba(255 255 255 / 0.4);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  .badge-founder {
    background: linear-gradient(45deg, #f39c12, #d35400);
    color: white;
    box-shadow: 0 0 15px #f39c12;
  }
  .badge-founder:hover {
    background: linear-gradient(45deg, #d35400, #f39c12);
    box-shadow: 0 0 20px #f39c12;
  }

  .badge-user {
    background: linear-gradient(45deg, #3498db, #2980b9);
    color: white;
    box-shadow: 0 0 15px #3498db;
  }
  .badge-user:hover {
    background: linear-gradient(45deg, #2980b9, #3498db);
    box-shadow: 0 0 20px #3498db;
  }

  /* Bio styling */
  .bio {
    font-size: 1.2rem;
    text-align: center;
    margin: 1.5rem 0 2rem;
    line-height: 1.5;
    color: #ddd;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Comments section */
  .comments-section {
    background: rgba(255 255 255 / 0.1);
    border-radius: 12px;
    padding: 1rem 1.5rem;
  }

  .comments-section h2 {
    text-align: center;
    margin-bottom: 1rem;
    font-weight: 700;
  }

  .comments-list {
    max-height: 220px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #ffdd57 transparent;
  }

  /* Scrollbar style for webkit */
  .comments-list::-webkit-scrollbar {
    width: 8px;
  }
  .comments-list::-webkit-scrollbar-track {
    background: transparent;
  }
  .comments-list::-webkit-scrollbar-thumb {
    background-color: #ffdd57;
    border-radius: 10px;
  }

  .comment {
    background: rgba(255 255 255 / 0.15);
    border-radius: 10px;
    padding: 0.8rem 1rem;
    margin-bottom: 1rem;
    color: #fff;
    font-weight: 400;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    user-select: none;
  }

  .comment-user {
    font-weight: 700;
    margin-bottom: 0.25rem;
    color: #ffdd57;
  }

  /* Responsive tweaks */
  @media (max-width: 480px) {
    .profile-container {
      padding: 1rem;
    }
    #usernameInput {
      width: 100%;
      font-size: 2rem;
    }
    #usernameDisplay {
      font-size: 2rem;
    }
  }
</style>
</head>
<body>

<div class="profile-container">

  <!-- Profile Avatar -->
  <img
    src="https://i.pravatar.cc/120?u=username123"
    alt="User Avatar"
    class="avatar"
    id="avatar"
    title="Click to change avatar"
  />
  
  <!-- Username with inline edit -->
  <div class="username-container">
    <span id="usernameDisplay" title="Click to edit username">username123</span>
    <input type="text" id="usernameInput" maxlength="20" />
    
    <!-- Badge example: change class to badge-user for normal users -->
    <div class="badge badge-founder" title="Founder Badge">
      <svg xmlns="http://www.w3.org/2000/svg" height="18" width="18" fill="currentColor" viewBox="0 0 16 16" >
        <path d="M8 0a5 5 0 0 1 5 5c0 1.007-.37 1.973-1 2.69V14H4V7.69A3.978 3.978 0 0 1 3 5a5 5 0 0 1 5-5zm2 5a2 2 0 1 0-4 0 2 2 0 0 0 4 0z"/>
      </svg>
      Founder
    </div>
  </div>

  <!-- Bio -->
  <p class="bio" id="bio">
    Passionate about astronomy and community building. Love sharing knowledge and exploring the universe.
  </p>

  <!-- Comments Section -->
  <div class="comments-section">
    <h2>Comments</h2>
    <div class="comments-list" id="comments-list">
      <!-- Comments will be injected here -->
    </div>
  </div>

</div>

<script>
  // Handle inline username edit
  const usernameDisplay = document.getElementById('usernameDisplay');
  const usernameInput = document.getElementById('usernameInput');

  usernameDisplay.addEventListener('click', () => {
    usernameInput.value = usernameDisplay.textContent;
    usernameDisplay.style.display = 'none';
    usernameInput.style.display = 'inline-block';
    usernameInput.focus();
  });

  usernameInput.addEventListener('blur', () => {
    let newUsername = usernameInput.value.trim();
    if (newUsername === '') {
      newUsername = 'username123'; // fallback default
    }
    usernameDisplay.textContent = newUsername;
    usernameDisplay.style.display = 'inline-block';
    usernameInput.style.display = 'none';
  });

  usernameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      usernameInput.blur();
    }
  });

  // Example comments data
  const comments = [
    { user: "astroFan42", text: "Great profile! Really inspired me." },
    { user: "starGazer", text: "Love your posts about meteor showers!" },
    { user: "spaceNerd", text: "Can't wait for your next blog entry." }
  ];

  const commentsList = document.getElementById('comments-list');
  comments.forEach(comment => {
    const commentEl = document.createElement('div');
    commentEl.classList.add('comment');
    commentEl.innerHTML = `
      <div class="comment-user">${comment.user}</div>
      <div class="comment-text">${comment.text}</div>
    `;
    commentsList.appendChild(commentEl);
  });
</script>

</body>
</html>
