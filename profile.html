<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sputnik Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }
    .sidebar {
      height: 100vh;
      width: 240px;
      position: fixed;
      background-color: #1a1a1a;
      color: white;
      padding-top: 2rem;
    }
    .sidebar a {
      display: block;
      color: white;
      padding: 1rem 2rem;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #333;
    }
    .main {
      margin-left: 240px;
      padding: 2rem;
    }
    .profile-box {
      background: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      max-width: 600px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .profile-pic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 2px solid #333;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-top: 10px;
    }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #3e8e41;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="blog.html">Blog</a>
    <a href="profile.html">Profile</a>
  </div>

  <div class="main">
    <div class="profile-box">
      <img id="pfp" class="profile-pic" src="https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png" alt="Profile Picture"/>
      <h2>👤 Profile</h2>
      <p><strong>Username:</strong> <span id="username">Guest</span></p>
      <p><strong>Role:</strong> <span id="role">N/A</span></p>
      <label for="bio"><strong>Bio:</strong></label><br/>
      <textarea id="bio" placeholder="Tell us about yourself..."></textarea><br/>
      <button id="save-btn">Save</button>
      <button id="sign-btn">Sign In with Google</button>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
window.addEventListener("DOMContentLoaded", () => {
  // all your Firebase init & auth code here
});
    const firebaseConfig = {
      apiKey: "AIzaSyCiI1zHK3pJgyOO_6R8_VsanoXGySAGk9k",
      authDomain: "sputnik-cosmotics.firebaseapp.com",
      projectId: "sputnik-cosmotics",
      storageBucket: "sputnik-cosmotics.appspot.com",
      messagingSenderId: "197760107068",
      appId: 
});
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const founderUID = "CImstFVO02deRULe8PSCiyO920Y2";

    const usernameEl = document.getElementById("username");
    const roleEl = document.getElementById("role");
    const bioEl = document.getElementById("bio");
    const signBtn = document.getElementById("sign-btn");
    const saveBtn = document.getElementById("save-btn");
    const pfp = document.getElementById("pfp");

    // Listen for auth state change
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        usernameEl.textContent = user.displayName;
        pfp.src = user.photoURL || "https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png";
        signBtn.textContent = "Sign Out";

        const userRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(userRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          bioEl.value = data.bio || "";
          roleEl.textContent = data.role || (user.uid === founderUID ? "Founder" : "Member");
        } else {
          const role = user.uid === founderUID ? "Founder" : "Member";
          await setDoc(userRef, {
            name: user.displayName,
            bio: "",
            role
          });
          roleEl.textContent = role;
        }
      } else {
        // Reset on sign out
        usernameEl.textContent = "Guest";
        roleEl.textContent = "N/A";
        signBtn.textContent = "Sign In with Google";
        pfp.src = "https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png";
        bioEl.value = "";
      }
    });

    // Sign in/out toggle
    signBtn.addEventListener("click", async () => {
      if (auth.currentUser) {
        await signOut(auth);
      } else {
        try {
          const provider = new GoogleAuthProvider();
          await signInWithPopup(auth, provider);
        } catch (error) {
          alert("Popup blocked! Please allow popups in your browser.");
        }
      }
    });

    // Save profile info
    saveBtn.addEventListener("click", async () => {
      const user = auth.currentUser;
      if (!user) {
        alert("Sign in first.");
        return;
      }

      const bio = bioEl.value;
      const role = user.uid === founderUID ? "Founder" : "Member";

      await setDoc(doc(db, "users", user.uid), {
        name: user.displayName,
        bio,
        role
      });

      alert("Profile saved!");
    });
  </script>
</body>
</html>
