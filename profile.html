<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sputnik Cosmotics - Profile</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0d0f1b;
      color: white;
    }

    .sidebar {
      height: 100vh;
      width: 240px;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #111627;
      padding-top: 2rem;
      border-right: 1px solid #1f2a40;
    }

    .sidebar a {
      display: block;
      padding: 1rem 2rem;
      color: #00ffc8;
      text-decoration: none;
      transition: 0.2s;
    }

    .sidebar a:hover {
      background-color: #1a1f34;
    }

    .main-content {
      margin-left: 240px;
      padding: 2rem;
    }

    .button {
      padding: 0.6rem 1.2rem;
      margin-top: 1rem;
      background-color: #00ffc8;
      color: #0d0f1b;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:hover {
      background-color: #00e6b3;
    }

    #user-info img {
      width: 100px;
      border-radius: 50%;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="blog.html">Blog</a>
    <a href="gallery.html">Gallery</a>
    <a href="profile.html">Profile</a>
  </div>

  <div class="main-content">
    <h1>My Profile</h1>
    <button class="button" onclick="signInWithGoogle()">Sign in with Google</button>
    <button class="button" onclick="signOut()">Sign out</button>

    <div id="user-info"></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js"></script>

  <!-- Initialize Firebase -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCiI1zHK3pJgyOO_6R8_VsanoXGySAGk9k",
      authDomain: "sputnik-cosmotics.firebaseapp.com",
      projectId: "sputnik-cosmotics",
      storageBucket: "sputnik-cosmotics.firebasestorage.app",
      messagingSenderId: "197760107068",
      appId: "1:197760107068:web:27f8aaff43dd072645f939"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const provider = new firebase.auth.GoogleAuthProvider();

    function signInWithGoogle() {
      auth.signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          saveUserToFirestore(user);
          showUserInfo(user);
        })
        .catch((error) => {
          console.error("Sign-in error:", error);
        });
    }

    function signOut() {
      auth.signOut().then(() => {
        document.getElementById("user-info").innerHTML = "";
        alert("Signed out");
      });
    }

    function saveUserToFirestore(user) {
      const userRef = db.collection("users").doc(user.uid);
      userRef.set({
        name: user.displayName,
        email: user.email,
        photo: user.photoURL,
        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }

    function showUserInfo(user) {
      document.getElementById("user-info").innerHTML = `
        <p>Signed in as: <strong>${user.displayName}</strong></p>
        <img src="${user.photoURL}" alt="User Photo" />
      `;
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        showUserInfo(user);
      }
    });
  </script>
</body>
</html>
