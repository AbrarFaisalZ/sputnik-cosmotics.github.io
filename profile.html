<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sputnik Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0d0f1b;
      color: white;
    }
    .sidebar {
      height: 100%;
      width: 220px;
      position: fixed;
      background-color: #111627;
      padding-top: 20px;
    }
    .sidebar a {
      padding: 10px 20px;
      display: block;
      color: white;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #00ffc8;
      color: #0d0f1b;
    }
    .main {
      margin-left: 240px;
      padding: 2rem;
    }
    .highlight {
      color: #00ffc8;
      font-weight: bold;
    }
    input, textarea {
      padding: 10px;
      width: 300px;
      border: none;
      border-radius: 5px;
      margin-bottom: 10px;
      font-size: 1rem;
    }
    button {
      padding: 10px 15px;
      background-color: #00ffc8;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      color: #0d0f1b;
    }
    button:hover {
      background-color: #00e6b3;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="index.html">🏠 Home</a>
    <a href="about.html">🧠 About Us</a>
    <a href="blog.html">📝 Blog</a>
    <a href="gallery.html">🖼️ Gallery</a>
    <a href="profile.html">👤 Profile</a>
  </div>

  <!-- Main Content -->
  <div class="main">
    <h1>My Profile</h1>
    <div id="profile-info">
      <p><strong>Username:</strong> <span id="display-username">Loading...</span></p>
      <p><strong>Bio:</strong> <span id="display-bio">Loading...</span></p>
      <p><strong>Role:</strong> <span id="display-role">Loading...</span></p>
    </div>

    <h3>Update Info</h3>
    <input type="text" id="usernameInput" placeholder="Enter username"><br>
    <textarea id="bioInput" placeholder="Write a short bio"></textarea><br>
    <button onclick="saveProfile()">Save Profile</button>
    <button onclick="signOut()">Sign Out</button>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "sputnik-cosmotics.firebaseapp.com",
      projectId: "sputnik-cosmotics",
      storageBucket: "sputnik-cosmotics.appspot.com",
      messagingSenderId: "197760107068",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Define founder UIDs
    const founderUids = ["CImstFVO02deRULe8PSCiyO920Y2"]; // ← Replace with your founder UID

    // Sign in automatically if not signed in
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        signInWithPopup(auth, provider).catch(alert);
        return;
      }

      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);

      if (userSnap.exists()) {
        const data = userSnap.data();
        document.getElementById("display-username").innerText = data.username || "No username";
        document.getElementById("display-bio").innerText = data.bio || "No bio";
        document.getElementById("display-role").innerText = data.role === "founder" ? "🌟 Founder" : "👥 Member";
      } else {
        // New user: create profile
        await setDoc(userRef, {
          username: user.displayName || "Anonymous",
          bio: "No bio yet.",
          role: founderUids.includes(user.uid) ? "founder" : "member"
        });
        location.reload();
      }
    });

    // Save Profile
    window.saveProfile = async function () {
      const user = auth.currentUser;
      if (!user) return alert("Not signed in.");

      const username = document.getElementById("usernameInput").value;
      const bio = document.getElementById("bioInput").value;

      const userRef = doc(db, "users", user.uid);
      await setDoc(userRef, {
        username,
        bio,
        role: founderUids.includes(user.uid) ? "founder" : "member"
      });

      alert("Profile updated!");
      location.reload();
    };

    // Sign out
    window.signOut = function () {
      signOut(auth).then(() => location.reload());
    };
  </script>

</body>
</html>
