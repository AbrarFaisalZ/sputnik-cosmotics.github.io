  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile | Sputnik Cosmotics</title>
  <style>
    body {
      background-color: #0d0f1b;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #111627;
      padding: 1rem;
      border-bottom: 1px solid #1f2a40;
    }
    h1 {
      color: #00ffc8;
    }
    .container {
      margin: 2rem auto;
      max-width: 500px;
      padding: 1rem;
    }
    input {
      width: 90%;
      padding: 0.7rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      padding: 0.7rem 1.5rem;
      background-color: #00ffc8;
      color: #0d0f1b;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 0.5rem;
    }
    .badge {
      background: #1a1f34;
      padding: 1rem;
      margin-top: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,255,255,0.2);
    }
  </style>
</head>
<!-- Firebase App (the core Firebase SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js"></script>
<!-- Firebase Firestore -->
<script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js"></script>
  <body>

  <header>
    <h1>User Profile</h1>
  </header>

  <div class="container">
    <div id="auth-section">
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <br />
      <button onclick="signUp()">Sign Up</button>
      <button onclick="logIn()">Log In</button>
    </div>

    <div id="user-section" style="display:none;">
      <h2>Welcome, <span id="user-email"></span></h2>
      <div class="badge">
        🎖️ <strong>Astronaut Badge</strong><br />
        For logging into Sputnik Cosmotics!
      </div>
      <br />
      <button onclick="logOut()">Log Out</button>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCiI1zHK3pJgyOO_6R8_VsanoXGySAGk9k",
      authDomain: "sputnik-cosmotics.firebaseapp.com",
      projectId: "sputnik-cosmotics",
      storageBucket: "sputnik-cosmotics.appspot.com",
      messagingSenderId: "197760107068",
      appId: "1:197760107068:web:27f8aaff43dd072645f939"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function signUp() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(email, pass)
        .then(user => alert("✅ Signup Successful!"))
        .catch(err => alert("❌ " + err.message));
    }

    function logIn() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, pass)
        .then(() => {})
        .catch(err => alert("❌ " + err.message));
    }

    function logOut() {
      auth.signOut();
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('user-section').style.display = 'block';
        document.getElementById('user-email').innerText = user.email;
      } else {
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('user-section').style.display = 'none';
      }
    });
  </script>
</body>
</html>
