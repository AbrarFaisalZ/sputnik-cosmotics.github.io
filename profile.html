<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile - Sputnik Cosmotics</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Basic styling for profile page */
    .profile-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
      text-align: center;
    }
    .profile-pic {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #3f51b5;
      cursor: pointer;
    }
    input[type="file"] {
      display: none;
    }
    .username-input {
      margin-top: 1rem;
      font-size: 1.5rem;
      font-weight: 600;
      border: none;
      border-bottom: 2px solid #3f51b5;
      outline: none;
      width: 100%;
      max-width: 300px;
      text-align: center;
    }
    .founder-badge {
      display: inline-block;
      background: #3f51b5;
      color: white;
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
      border-radius: 4px;
      margin-left: 0.5rem;
      vertical-align: middle;
      text-decoration: none;
    }
    .btn-google {
      margin: 1rem 0.5rem;
      background: #4285f4;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-logout {
      background: #d9534f;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Navbar (same as other pages) -->
  <nav>
    <ul class="navbar">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="profile.html" class="active">Profile</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="gallery.html">Gallery</a></li>
    </ul>
  </nav>

  <main class="profile-container">
    <h1>Your Profile</h1>
    
    <!-- Profile Picture with default and upload option -->
    <label for="upload-pic">
      <img
        id="profile-pic"
        src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
        alt="Profile Picture"
        class="profile-pic"
        title="Click to upload a custom profile picture"
      />
    </label>
    <input type="file" id="upload-pic" accept="image/*" />

    <!-- Editable Username -->
    <input
      type="text"
      id="username"
      class="username-input"
      placeholder="Enter your username"
      maxlength="30"
    />

    <!-- Founders section with founder badge -->
    <section style="margin-top:2rem;">
      <h2>Founders</h2>
      <p>
        Nafinul Islam Nirob
        <a href="https://instagram.com/nafinulnirob" target="_blank" class="founder-badge">Founder</a>
      </p>
      <p>
        Abrar Faisal Zarif
        <a href="https://instagram.com/abrarfaisalz" target="_blank" class="founder-badge">Founder</a>
      </p>
      <p>
        Tahsin Haider
        <a href="https://instagram.com/tahsinhaider" target="_blank" class="founder-badge">Founder</a>
      </p>
    </section>

    <!-- Google Sign-In and Log Out Buttons -->
    <div style="margin-top: 2rem;">
      <button id="google-signin" class="btn-google">Sign in with Google</button>
      <button id="logout-btn" class="btn-logout" style="display:none;">Log Out</button>
    </div>
  </main>

  <script>
    // Save and load username from localStorage
    const usernameInput = document.getElementById('username');
    const profilePic = document.getElementById('profile-pic');
    const uploadPicInput = document.getElementById('upload-pic');

    // Load saved username
    const savedUsername = localStorage.getItem('username');
    if (savedUsername) {
      usernameInput.value = savedUsername;
    }

    usernameInput.addEventListener('input', () => {
      localStorage.setItem('username', usernameInput.value.trim());
    });

    // Upload and preview custom profile picture (saved in localStorage)
    uploadPicInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function (event) {
          profilePic.src = event.target.result;
          localStorage.setItem('profilePic', event.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    // Load saved profile pic
    const savedPic = localStorage.getItem('profilePic');
    if (savedPic) {
      profilePic.src = savedPic;
    }

    // Google Sign-In & Log Out (simple simulation)
    const signInBtn = document.getElementById('google-signin');
    const logoutBtn = document.getElementById('logout-btn');

    function updateAuthUI(isSignedIn) {
      if (isSignedIn) {
        signInBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
      } else {
        signInBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
      }
    }

    // For demo, "sign in" just sets a flag in localStorage
    signInBtn.addEventListener('click', () => {
      localStorage.setItem('signedIn', 'true');
      updateAuthUI(true);
      alert('Signed in successfully!');
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('signedIn');
      updateAuthUI(false);
      alert('Logged out!');
    });

    // Initialize auth UI on page load
    const isSignedIn = localStorage.getItem('signedIn') === 'true';
    updateAuthUI(isSignedIn);
  </script>
</body>
</html>
