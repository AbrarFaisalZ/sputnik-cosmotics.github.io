<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Profile | Sputnik Cosmotics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0d0f1b;
      color: white;
    }
    .sidebar {
      height: 100%;
      width: 220px;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #111627;
      padding-top: 20px;
      border-right: 1px solid #1f2a40;
    }
    .sidebar a {
      padding: 12px 20px;
      display: block;
      color: #00ffc8;
      text-decoration: none;
      transition: 0.2s;
    }
    .sidebar a:hover {
      background-color: #1f2a40;
    }
    .main {
      margin-left: 240px;
      padding: 2rem;
    }
    .profile-card {
      background-color: #1a1f34;
      padding: 2rem;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,255,255,0.1);
    }
    .profile-pic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 1rem;
      border: 2px solid #00ffc8;
    }
    .login-btn {
      padding: 10px 20px;
      background-color: #00ffc8;
      color: #0d0f1b;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .login-btn:hover {
      background-color: #00e6b3;
    }
  </style>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCiI1zHK3pJgyOO_6R8_VsanoXGySAGk9k",
      authDomain: "sputnik-cosmotics.firebaseapp.com",
      projectId: "sputnik-cosmotics",
      storageBucket: "sputnik-cosmotics.appspot.com",
      messagingSenderId: "197760107068",
      appId: "1:197760107068:web:27f8aaff43dd072645f939"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.login = () => {
      signInWithPopup(auth, provider).catch((error) => {
        alert("Login failed: " + error.message);
      });
    };

    onAuthStateChanged(auth, (user) => {
      const profileSection = document.getElementById("profile");
      if (user) {
        profileSection.innerHTML = `
          <div class="profile-card">
            <img src="${user.photoURL}" class="profile-pic" alt="User photo" />
            <h2>${user.displayName}</h2>
            <p>${user.email}</p>
          </div>
        `;
      } else {
        profileSection.innerHTML = `
          <div style="text-align:center;">
            <p>Please sign in to view your profile.</p>
            <button class="login-btn" onclick="login()">Sign in with Google</button>
          </div>
        `;
      }
    });
  </script>
</head>

<body>
  <div class="sidebar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="blog.html">Blog</a>
    <a href="profile.html">Profile</a>
  </div>

  <div class="main">
    <h1>My Profile</h1>
    <div id="profile">
      <!-- Dynamic user profile will appear here -->
    </div>
  </div>
</body>
</html>
