<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>User Profile</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 0;
  }
  .profile-container {
    max-width: 600px;
    margin: 2rem auto;
    background: #fff;
    padding: 1.5rem 2rem;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(0,0,0,0.1);
  }
  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #4a90e2;
  }
  .username {
    font-size: 1.8rem;
    font-weight: 700;
    margin: 0.5rem 0;
    display: flex;
    align-items: center;
  }
  .role-founder {
    background: #f39c12;
    color: white;
    font-size: 0.9rem;
    padding: 0.1rem 0.5rem;
    border-radius: 4px;
    margin-left: 10px;
  }
  .bio {
    font-size: 1.1rem;
    color: #333;
    margin-bottom: 1.5rem;
  }
  .comments-section {
    border-top: 1px solid #ddd;
    padding-top: 1rem;
  }
  .comment {
    background: #eaf0fb;
    padding: 0.8rem 1rem;
    margin-bottom: 1rem;
    border-radius: 6px;
  }
  .comment-user {
    font-weight: 600;
    margin-bottom: 0.3rem;
  }
  /* Simple scroll container for comments */
  .comments-list {
    max-height: 200px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="profile-container">

  <!-- Profile Info -->
  <img
    src="https://i.pravatar.cc/100?u=username123"
    alt="User Avatar"
    class="avatar"
  />
  
  <h1 class="username">
    username123
    <span class="role-founder" title="Founder">Founder</span>
  </h1>
  
  <p class="bio">
    Passionate about astronomy and community building. Love sharing knowledge and exploring the universe.
  </p>
  
  <!-- Comments Section -->
  <div class="comments-section">
    <h2>Comments</h2>
    <div class="comments-list" id="comments-list">
      <!-- Comments will be injected here -->
    </div>
  </div>
</div>

<script>
  // Example comments data (simulate fetched or pre-loaded)
  const comments = [
    { user: "astroFan42", text: "Great profile! Really inspired me." },
    { user: "starGazer", text: "Love your posts about meteor showers!" },
    { user: "spaceNerd", text: "Can't wait for your next blog entry." }
  ];

  // Insert comments into DOM
  const commentsList = document.getElementById('comments-list');

  comments.forEach(comment => {
    const commentEl = document.createElement('div');
    commentEl.classList.add('comment');
    
    commentEl.innerHTML = `
      <div class="comment-user">${comment.user}</div>
      <div class="comment-text">${comment.text}</div>
    `;

    commentsList.appendChild(commentEl);
  });
</script>

</body>
</html>
