<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile | Sputnik Cosmotics</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
    }

    nav {
      background: #161b22;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 1rem;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      background: #161b22;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .profile-header img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #58a6ff;
    }
    .profile-info {
      flex: 1;
    }
    .profile-info input,
    .profile-info textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 6px;
      margin-bottom: 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 6px;
    }

    button {
      padding: 10px 20px;
      margin-top: 10px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #2ea043;
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 2rem;
    }

    .badge {
      padding: 8px 10px;
      background: #2d333b;
      border: 1px solid #444c56;
      border-radius: 8px;
      text-align: center;
      opacity: 0.5;
      transition: 0.2s ease;
      position: relative;
      font-size: 14px;
    }

    .badge.unlocked {
      background: #238636;
      border-color: #2ea043;
      color: white;
      opacity: 1;
    }

    .badge:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 120%;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      color: #fff;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 5px;
      white-space: nowrap;
      z-index: 5;
    }
  </style>
</head>
<body>
  <nav>
    <div>🚀 Sputnik Cosmotics</div>
    <div>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="profile.html">Profile</a>
      <a href="blog.html">Blog</a>
      <a href="journal.html">Journal</a>
    </div>
  </nav>

  <div class="container">
    <div class="profile-header">
      <img id="pfp" src="https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png" alt="User Picture" />
      <input type="file" id="pfpUpload" accept="image/*" onchange="uploadPfp()" style="margin-top:10px; color: white;" />
      <div class="profile-info">
        <label>Name:</label>
        <input id="name" type="text" placeholder="Your name" />

        <label>Bio:</label>
        <textarea id="bio" rows="3" placeholder="Short bio..."></textarea>

        <label>Joined:</label>
        <input id="joined" type="text" disabled />

        <button onclick="saveProfile()">Save Profile</button>
      </div>
    </div>

    <h3 style="margin-top: 2rem;">🏅 Badges</h3>
    <div id="badges" class="badge-grid"></div>
  </div>
<!-- Firebase CDN SDKs (add in <head> or before your scripts) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>

<script>
  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCiI1zHK3pJgyOO_6R8_VsanoXGySAGk9k",
    authDomain: "sputnik-cosmotics.firebaseapp.com",
    projectId: "sputnik-cosmotics",
    storageBucket: "sputnik-cosmotics.appspot.com",
    messagingSenderId: "197760107068",
    appId: "1:197760107068:web:27f8aaff43dd072645f939"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);

  // Optional: Firestore and Auth references
  const db = firebase.firestore();
  const auth = firebase.auth();
    </script>
  <script>
    const defaultPic = "https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png";

    function loadProfile() {
      document.getElementById('name').value = localStorage.getItem('userName') || '';
      document.getElementById('bio').value = localStorage.getItem('userBio') || '';
      document.getElementById('pfp').src = localStorage.getItem('userPic') || defaultPic;

      const joined = localStorage.getItem('joinedDate');
      if (joined) {
        document.getElementById('joined').value = joined;
      } else {
        const today = new Date().toLocaleDateString();
        localStorage.setItem('joinedDate', today);
        document.getElementById('joined').value = today;
      }

      // Badge logic
      const hasFirstPost = localStorage.getItem("firstPost") === "true";
      const newsRead = parseInt(localStorage.getItem("newsReadCount")) || 0;
      const isFounder = localStorage.getItem("isFounder") === "true";

      const badgeHTML = [
        `<span class="badge unlocked" data-tooltip="Created your profile">🎖 Astronaut</span>`,
        `<span class="badge ${hasFirstPost ? 'unlocked' : ''}" data-tooltip="Published your first blog post">📝 First Post</span>`,
        `<span class="badge" data-tooltip="Visited 3 times at night">🔭 Night Watcher</span>`,
        `<span class="badge" data-tooltip="Uploaded a photo">📸 Astrophotographer</span>`,
        `<span class="badge" data-tooltip="Replied to 10 posts">💬 Forum Fanatic</span>`,
        `<span class="badge" data-tooltip="Visited planet page 5 times">🪐 Planet Hunter</span>`,
        `<span class="badge ${newsRead >= 10 ? 'unlocked' : ''}" data-tooltip="Read 10 news articles">📚 Journal Reader</span>`,
        `<span class="badge" data-tooltip="Completed a quiz">🧠 Big Brain</span>`,
        `<span class="badge ${isFounder ? 'unlocked' : ''}" data-tooltip="Founder of Sputnik Cosmotics">🎉 Founder’s Circle</span>`,
        `<span class="badge" data-tooltip="You found the secret!">👽 Alien Spotter</span>`
      ].join("");

      document.getElementById("badges").innerHTML = badgeHTML;
    }

    function saveProfile() {
      function uploadPfp() {
  const file = document.getElementById('pfpUpload').files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onloadend = function () {
    const base64 = reader.result;
    localStorage.setItem('userPic', base64);
    document.getElementById('pfp').src = base64;
    alert('Profile picture updated!');
  };
  reader.readAsDataURL(file);
        }
      const name = document.getElementById('name').value;
      const bio = document.getElementById('bio').value;

      localStorage.setItem('userName', name);
      localStorage.setItem('userBio', bio);

      alert('Profile saved!');
    }

    loadProfile();
  </script>
</body>
</html>
