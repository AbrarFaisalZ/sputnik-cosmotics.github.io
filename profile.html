  <head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>User Profile</title>
<style>
  /* Background matching other pages style */
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #282c34, #3a3f55);
    margin: 0;
    padding: 2rem 0;
    color: #eee;
    display: flex;
    justify-content: center;
  }

  .profile-container {
    max-width: 540px;
    width: 90%;
    background: #222831;
    padding: 2rem 2.5rem;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    text-align: center;
  }

  .avatar {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #00adb5;
    margin: 0 auto 1.5rem;
    background-color: #393e46;
    cursor: default;
  }

  .username-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-bottom: 1rem;
  }

  #usernameDisplay {
    font-size: 2.6rem;
    font-weight: 700;
    cursor: pointer;
    color: #eeeeee;
    user-select: none;
    transition: color 0.3s ease;
  }
  #usernameDisplay:hover {
    color: #00adb5;
  }

  #usernameInput {
    font-size: 2.6rem;
    font-weight: 700;
    border: none;
    border-bottom: 2px solid #00adb5;
    background: transparent;
    color: #eee;
    outline: none;
    width: 280px;
    display: none;
  }

  /* Founder badge */
  .badge-founder {
    background: linear-gradient(45deg, #f39c12, #d35400);
    color: white;
    font-weight: 600;
    font-size: 1rem;
    padding: 5px 16px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 0 14px #f39c12;
    user-select: none;
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }
  .badge-founder:hover {
    background: linear-gradient(45deg, #d35400, #f39c12);
    box-shadow: 0 0 22px #f39c12;
  }

  .badge-founder svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .bio {
    font-size: 1.25rem;
    color: #ccc;
    line-height: 1.5;
    margin-top: 0.75rem;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }

  @media (max-width: 480px) {
    #usernameDisplay,
    #usernameInput {
      font-size: 2rem;
      width: 200px;
    }
    .bio {
      font-size: 1rem;
    }
  }
</style>
</head>
<body>

<div class="profile-container">
  <!-- User Avatar -->
  <img
    id="avatar"
    class="avatar"
    src=""
    alt="User Avatar"
    title="User Avatar"
  />

  <!-- Username with inline edit -->
  <div class="username-container">
    <span id="usernameDisplay" title="Click to edit username">username123</span>
    <input type="text" id="usernameInput" maxlength="20" />
    <div class="badge-founder" title="Founder Badge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path d="M8 0a5 5 0 0 1 5 5c0 1.007-.37 1.973-1 2.69V14H4V7.69A3.978 3.978 0 0 1 3 5a5 5 0 0 1 5-5zm2 5a2 2 0 1 0-4 0 2 2 0 0 0 4 0z"/>
      </svg>
      Founder
    </div>
  </div>

  <!-- User Bio -->
  <p class="bio" id="bio">
    Passionate about astronomy and community building. Love sharing knowledge and exploring the universe.
  </p>
</div>

<script>
  // Default avatar URL function (Google-style)
  function getDefaultAvatar(username) {
    // Generate a Google avatar URL based on username hash (or any fallback)
    // For simplicity, use a placeholder service with unique query param
    return `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=00adb5&color=fff&size=130`;
  }

  // Set avatar src: if userAvatar is empty, fallback to default avatar
  const userAvatar = ''; // Put user's avatar URL here or keep empty for default
  const usernameDisplay = document.getElementById('usernameDisplay');
  const avatar = document.getElementById('avatar');

  function updateAvatar() {
    const username = usernameDisplay.textContent.trim() || 'User';
    avatar.src = userAvatar || getDefaultAvatar(username);
    avatar.alt = `${username}'s Avatar`;
  }

  // Run on load
  updateAvatar();

  // Inline username editing logic
  const usernameInput = document.getElementById('usernameInput');

  usernameDisplay.addEventListener('click', () => {
    usernameInput.value = usernameDisplay.textContent;
    usernameDisplay.style.display = 'none';
    usernameInput.style.display = 'inline-block';
    usernameInput.focus();
  });

  function saveUsername() {
    let newUsername = usernameInput.value.trim();
    if (!newUsername) {
      newUsername = 'username123'; // fallback default
    }
    usernameDisplay.textContent = newUsername;
    usernameDisplay.style.display = 'inline-block';
    usernameInput.style.display = 'none';

    // Update avatar with new username for default avatar
    updateAvatar();
  }

  usernameInput.addEventListener('blur', saveUsername);

  usernameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      usernameInput.blur();
    }
  });
</script>

</body>
</html>
