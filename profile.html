<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sputnik Profile</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
      color: white;
    }
    .sidebar {
      height: 100vh;
      width: 240px;
      position: fixed;
      background-color: #1a1a1a;
      color: white;
      padding-top: 2rem;
    }
    .sidebar a {
      display: block;
      color: white;
      padding: 1rem 2rem;
      text-decoration: none;
      transition: background 0.3s;
    }
    .sidebar a:hover {
      background-color: #333;
    }
    .main {
      margin-left: 240px;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .profile-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
    }
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #4CAF50;
      margin-bottom: 1rem;
    }
    textarea, input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.5rem;
      border-radius: 8px;
      border: none;
    }
    button {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #3e8e41;
    }
  </style>
</head>
<body>  <div class="sidebar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="blog.html">Blog</a>
    <a href="profile.html">Profile</a>
  </div>  <div class="main">
    <div class="profile-box">
      <div style="text-align: center;">
        <img id="pfp" class="profile-pic" src="https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png" alt="Profile Picture"/>
        <h2 id="username">Guest</h2>
        <p><strong>Role:</strong> <span id="role">N/A</span></p>
      </div>
      <label for="bio"><strong>Bio:</strong></label>
      <textarea id="bio" placeholder="Tell us about yourself..."></textarea>
      <button id="save-btn">Save Profile</button>
      <button id="sign-btn">Sign In with Google</button>
    </div>
  </div>  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCiI1zHK3pJgyOO_6R8_VsanoXGySAGk9k",
      authDomain: "sputnik-cosmotics.firebaseapp.com",
      projectId: "sputnik-cosmotics",
      storageBucket: "sputnik-cosmotics.appspot.com",
      messagingSenderId: "197760107068",
      appId: "1:197760107068:web:27f8aaff43dd072645f939"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const founderUID = "CImstFVO02deRULe8PSCiyO920Y2";

    const usernameEl = document.getElementById("username");
    const roleEl = document.getElementById("role");
    const bioEl = document.getElementById("bio");
    const signBtn = document.getElementById("sign-btn");
    const saveBtn = document.getElementById("save-btn");
    const pfp = document.getElementById("pfp");

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(userRef);

        usernameEl.textContent = user.displayName;
        pfp.src = user.photoURL || pfp.src;
        signBtn.textContent = "Sign Out";

        if (docSnap.exists()) {
          const data = docSnap.data();
          bioEl.value = data.bio || "";
          roleEl.textContent = data.role || (user.uid === founderUID ? "Founder" : "Member");
        } else {
          const role = user.uid === founderUID ? "Founder" : "Member";
          await setDoc(userRef, {
            name: user.displayName,
            bio: "",
            role
          });
          roleEl.textContent = role;
        }
      } else {
        usernameEl.textContent = "Guest";
        roleEl.textContent = "N/A";
        signBtn.textContent = "Sign In with Google";
        pfp.src = "https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png";
        bioEl.value = "";
      }
    });

    signBtn.addEventListener("click", async () => {
      if (auth.currentUser) {
        await signOut(auth);
      } else {
        try {
          const provider = new GoogleAuthProvider();
          await signInWithPopup(auth, provider);
        } catch (error) {
          alert("Popup blocked! Please allow popups in your browser.");
        }
      }
    });

    saveBtn.addEventListener("click", async () => {
      const user = auth.currentUser;
      if (!user) {
        alert("Sign in first.");
        return;
      }

      const bio = bioEl.value.trim();
      const role = user.uid === founderUID ? "Founder" : "Member";

      try {
        await setDoc(doc(db, "users", user.uid), {
          name: user.displayName,
          bio,
          role
        });

        // Redirect to user view page
        window.location.href = `user.html?uid=${user.uid}`;
      } catch (err) {
        alert("Error saving profile: " + err.message);
      }
    });
  </script></body>
</html>
