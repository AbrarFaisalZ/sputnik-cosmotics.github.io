<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sputnik Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .sidebar {
      height: 100vh;
      width: 240px;
      position: fixed;
      background-color: #1a1a1a;
      color: white;
      padding-top: 2rem;
    }
    .sidebar a {
      display: block;
      color: white;
      padding: 1rem 2rem;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #333;
    }
    .main {
      margin-left: 240px;
      padding: 2rem;
    }
    .profile-box {
      background: #f3f3f3;
      padding: 1.5rem;
      border-radius: 10px;
      max-width: 600px;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-top: 10px;
    }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #3e8e41;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="blog.html">Blog</a>
    <a href="profile.html">Profile</a>
  </div>

  <div class="main">
    <div class="profile-box">
      <h2>👤 Profile</h2>
      <p><strong>Username:</strong> <span id="username">Loading...</span></p>
      <p><strong>Role:</strong> <span id="role">Loading...</span></p>
      <label for="bio"><strong>Bio:</strong></label><br/>
      <textarea id="bio" placeholder="Tell us about yourself..."></textarea><br/>
      <button id="save-btn">Save</button>
      <button id="sign-btn">Sign In with Google</button>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCiI1zHK3pJgyOO_6R8_VsanoXGySAGk9k",
      authDomain: "sputnik-cosmotics.firebaseapp.com",
      projectId: "sputnik-cosmotics",
      storageBucket: "sputnik-cosmotics.appspot.com",
      messagingSenderId: "197760107068",
      appId: "1:197760107068:web:27f8aaff43dd072645f939"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const founderUID = "CImstFVO02deRULe8PSCiyO920Y2";
    let currentUser = null;

    const usernameEl = document.getElementById("username");
    const roleEl = document.getElementById("role");
    const bioEl = document.getElementById("bio");
    const signBtn = document.getElementById("sign-btn");
    const saveBtn = document.getElementById("save-btn");

    // Auth state listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        usernameEl.textContent = user.displayName;
        signBtn.textContent = "Sign Out";

        const userRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(userRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          bioEl.value = data.bio || "";
          roleEl.textContent = data.role || (user.uid === founderUID ? "Founder" : "Member");
        } else {
          const role = user.uid === founderUID ? "Founder" : "Member";
          await setDoc(userRef, {
            name: user.displayName,
            bio: "",
            role
          });
          roleEl.textContent = role;
        }
      } else {
        currentUser = null;
        usernameEl.textContent = "Guest";
        roleEl.textContent = "N/A";
        signBtn.textContent = "Sign In with Google";
        bioEl.value = "";
      }
    });

    // Sign in/out toggle
    signBtn.addEventListener("click", async () => {
      if (currentUser) {
        await signOut(auth);
      } else {
        try {
          const provider = new GoogleAuthProvider();
          await signInWithPopup(auth, provider);
        } catch (error) {
          alert("Popup blocked! Please allow popups.");
          console.error(error);
        }
      }
    });

    // Save profile
    saveBtn.addEventListener("click", async () => {
      if (!currentUser) {
        alert("You must be signed in to save your profile.");
        return;
      }

      const bio = bioEl.value;
      const role = currentUser.uid === founderUID ? "Founder" : "Member";

      try {
        await setDoc(doc(db, "users", currentUser.uid), {
          name: currentUser.displayName,
          bio,
          role
        });
        alert("Profile saved!");
      } catch (err) {
        alert("Error saving profile.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
