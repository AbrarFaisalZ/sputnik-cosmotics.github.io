<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sputnik Cosmotics Blog</title>
  <style>
    body {
      background-color: #0e0e1a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1c1c2e;
      padding: 1rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
    }
    .blog-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .post {
      background-color: #1c1c2e;
      border: 1px solid #333;
      border-radius: 8px;
      margin-bottom: 2rem;
      padding: 1.5rem;
    }
    .post h2 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #00ffcc;
    }
    .post .meta {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sputnik Cosmotics Blog</h1>
  </header>
  <div class="blog-container" id="blog-posts">
    <p>Loading blog posts...</p>
  </div>

  <script>
    async function loadPosts() {
      const response = await fetch('blog-posts.json');
      const posts = await response.json();
      const container = document.getElementById('blog-posts');
      container.innerHTML = '';

      posts.forEach(post => {
        const postEl = document.createElement('div');
        postEl.className = 'post';
        postEl.innerHTML = `
          <h2>${post.title}</h2>
          <div class="meta">By ${post.author} | ${post.date}</div>
          <p>${post.content}</p>
        `;
        container.appendChild(postEl);
      });
    }

    loadPosts();
  </script>
</body>
</html>
